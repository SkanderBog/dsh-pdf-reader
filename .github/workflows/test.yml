name: PDF plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: macos-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.1
            cordis: 4.0.5-alpha.1
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.2
            cordis: 4.0.5-alpha.1
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-rc.2
            cordis: 4.0.5
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-rc.5
            cordis: 4.0.5
          - os: ubuntu-latest
            node: 24
            harness: 0.2.2-alpha.2
            cordis: 4.0.6-alpha.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Linux PDF and OCR tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
      - name: Install macOS PDF and OCR tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract tesseract-lang
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test against the alternate Harness version
        if: matrix.harness != '0.2.0-rc.2'
        shell: bash
        env:
          HARNESS_TEST_VERSION: ${{ matrix.harness }}
          HARNESS_CORDIS_VERSION: ${{ matrix.cordis }}
          NODE_OPTIONS: --max-old-space-size=1024
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { devDependencies } = JSON.parse(readFileSync('package.json', 'utf8'))
          const packages = Object.keys(devDependencies).filter(name => name.startsWith('@deepseek-ai/dsh-'))
          if (['0.2.1-rc.5', '0.2.2-alpha.2'].includes(process.env.HARNESS_TEST_VERSION)) packages.push('@deepseek-ai/dsh-llm-deepseek')
          if (process.env.HARNESS_TEST_VERSION.startsWith('0.2.2-')) packages.push('@deepseek-ai/dsh-tool-executor-native')
          execFileSync('npm', ['install', '--no-save', '--package-lock=false', '--ignore-scripts', '--no-audit', '--no-fund', `@deepseek-ai/cordis@${process.env.HARNESS_CORDIS_VERSION}`, ...packages.map(name => `${name}@${process.env.HARNESS_TEST_VERSION}`)], { stdio: 'inherit' })
          JS
      - run: npm run check
      - run: npm run test:package
        env:
          DSH_PDF_TEST_MODELS: ${{ matrix.harness == '0.2.1-rc.5' || matrix.harness == '0.2.2-alpha.2' }}
  profile:
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: 0.2.0-rc.2
            cordis: 4.0.4
            group: 1.0.4
            include: 1.0.9
            loader: 1.0.5
            timer: 1.1.6
          - harness: 0.2.1-rc.5
            cordis: 4.0.5
            group: 1.0.5
            include: 1.0.10
            loader: 1.0.6
            timer: 1.1.7
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install native PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install an isolated exact DSH CLI
        timeout-minutes: 5
        env:
          NODE_OPTIONS: --max-old-space-size=1024
        # rc.2's floating Cordis peers now select a newer family that makes
        # npm loop until OOM. Pin the compatible family used by this fixture.
        run: |
          npm install --prefix "$RUNNER_TEMP/pdf-reader-host" --ignore-scripts --no-audit --no-fund --save-exact \
            @deepseek-ai/dsh@${{ matrix.harness }} \
            @deepseek-ai/cordis@${{ matrix.cordis }} \
            @deepseek-ai/cordis-plugin-group@${{ matrix.group }} \
            @deepseek-ai/cordis-plugin-include@${{ matrix.include }} \
            @deepseek-ai/cordis-plugin-loader@${{ matrix.loader }} \
            @deepseek-ai/cordis-plugin-timer@${{ matrix.timer }}
          npm ls --prefix "$RUNNER_TEMP/pdf-reader-host" @deepseek-ai/dsh @deepseek-ai/cordis @deepseek-ai/cordis-plugin-group @deepseek-ai/cordis-plugin-include @deepseek-ai/cordis-plugin-loader @deepseek-ai/cordis-plugin-timer
      - name: Real CLI install, start, tool execution and uninstall
        env:
          DSH_CLI: ${{ runner.temp }}/pdf-reader-host/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_PROFILE_EVIDENCE: validation/store-profile-ci.json
        run: npm run test:profile
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-profile-evidence-${{ matrix.harness }}
          path: validation/store-profile-ci.json
          if-no-files-found: error
