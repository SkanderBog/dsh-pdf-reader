name: PDF plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: macos-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.1
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Linux PDF and OCR tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
      - name: Install macOS PDF and OCR tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract tesseract-lang
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test against the alternate Harness version
        if: matrix.harness != '0.2.0-rc.2'
        shell: bash
        env:
          HARNESS_TEST_VERSION: ${{ matrix.harness }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { devDependencies } = JSON.parse(readFileSync('package.json', 'utf8'))
          const packages = Object.keys(devDependencies).filter(name => name.startsWith('@deepseek-ai/dsh-'))
          execFileSync('npm', ['install', '--no-save', '--package-lock=false', '--ignore-scripts', '--no-audit', '--no-fund', ...packages.map(name => `${name}@${process.env.HARNESS_TEST_VERSION}`)], { stdio: 'inherit' })
          JS
      - run: npm run check
      - run: npm run test:package
