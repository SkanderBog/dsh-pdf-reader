name: PDF plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Linux PDF and OCR tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
      - name: Install macOS PDF and OCR tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract tesseract-lang
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm run test:package
