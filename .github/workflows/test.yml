name: PDF plugin tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: macos-latest
            node: 24
            harness: 0.2.0-rc.2
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.1
          - os: ubuntu-latest
            node: 24
            harness: 0.2.1-alpha.2
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install Linux PDF and OCR tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng tesseract-ocr-chi-sim
      - name: Install macOS PDF and OCR tools
        if: runner.os == 'macOS'
        run: brew install poppler tesseract tesseract-lang
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test against the alternate Harness version
        if: matrix.harness != '0.2.0-rc.2'
        shell: bash
        env:
          HARNESS_TEST_VERSION: ${{ matrix.harness }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const { devDependencies } = JSON.parse(readFileSync('package.json', 'utf8'))
          const packages = Object.keys(devDependencies).filter(name => name.startsWith('@deepseek-ai/dsh-'))
          execFileSync('npm', ['install', '--no-save', '--package-lock=false', '--ignore-scripts', '--no-audit', '--no-fund', '@deepseek-ai/cordis@4.0.5-alpha.1', ...packages.map(name => `${name}@${process.env.HARNESS_TEST_VERSION}`)], { stdio: 'inherit' })
          JS
      - run: npm run check
      - run: npm run test:package
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - name: Install native PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - name: Install an isolated exact DSH CLI
        run: npm install --prefix "$RUNNER_TEMP/pdf-reader-host" --ignore-scripts --no-audit --no-fund @deepseek-ai/dsh@0.2.0-rc.2
      - name: Real CLI install, start, tool execution and uninstall
        env:
          DSH_CLI: ${{ runner.temp }}/pdf-reader-host/node_modules/@deepseek-ai/dsh/lib/bin.js
          DSH_PROFILE_EVIDENCE: validation/store-profile-ci.json
        run: npm run test:profile
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-reader-profile-evidence
          path: validation/store-profile-ci.json
          if-no-files-found: error
